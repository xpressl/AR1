version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: ar_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ar_password}
      POSTGRES_DB: ${POSTGRES_DB:-ar_control_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ar_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: ar_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ar_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ar_user}:${POSTGRES_PASSWORD:-ar_password}@postgres:5432/${POSTGRES_DB:-ar_control_hub}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./data/imports:/app/data/imports:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ar_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Import Worker
  import-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ar_import_worker
    command: python -m src.data_pipeline.scheduler.import_scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ar_user}:${POSTGRES_PASSWORD:-ar_password}@postgres:5432/${POSTGRES_DB:-ar_control_hub}
      REDIS_URL: redis://redis:6379
      IMPORT_DATA_PATH: /app/data/imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/imports:/app/data/imports:ro
      - ./src:/app/src:ro

  # Email Worker
  email-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ar_email_worker
    command: python -m src.services.workflow.email_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ar_user}:${POSTGRES_PASSWORD:-ar_password}@postgres:5432/${POSTGRES_DB:-ar_control_hub}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: ar_network

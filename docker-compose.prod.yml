# ==============================================================================
# AR Control Hub - Docker Compose (Production)
# ==============================================================================
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml logs -f
#   docker-compose -f docker-compose.prod.yml down
#
# With environment file:
#   docker-compose -f docker-compose.prod.yml --env-file .env.production up -d
# ==============================================================================

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:14-alpine
    container_name: ar_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-ar_control_hub}
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-ar_control_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - ar_network_internal

  # ============================================================================
  # Redis Cache and Message Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ar_redis_prod
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - ar_network_internal

  # ============================================================================
  # Backend API (Production)
  # ============================================================================
  backend:
    image: ${DOCKER_REGISTRY:-}ar-control-hub-backend:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runner
    container_name: ar_backend_prod
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ar_control_hub}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ar_control_hub}
      POSTGRES_USER: ${POSTGRES_USER}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Application
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      API_PORT: 8000
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com}
      # Security
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,app.example.com}
    secrets:
      - jwt_secret
      - postgres_password
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - ar_network_internal
      - ar_network_public

  # ============================================================================
  # Frontend (Production)
  # ============================================================================
  frontend:
    image: ${DOCKER_REGISTRY:-}ar-control-hub-frontend:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
    container_name: ar_frontend_prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${FRONTEND_REPLICAS:-2}
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - ar_network_public

  # ============================================================================
  # Data Import Worker (Production)
  # ============================================================================
  import-worker:
    image: ${DOCKER_REGISTRY:-}ar-control-hub-backend:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runner
    container_name: ar_import_worker_prod
    command: python -m src.data_pipeline.scheduler.import_scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ar_control_hub}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      IMPORT_DATA_PATH: /app/data/imports
      IMPORT_SCHEDULE: ${IMPORT_SCHEDULE:-0 2 * * *}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - postgres_password
    volumes:
      - import_data:/app/data/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - ar_network_internal

  # ============================================================================
  # Email Worker (Production)
  # ============================================================================
  email-worker:
    image: ${DOCKER_REGISTRY:-}ar-control-hub-backend:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runner
    container_name: ar_email_worker_prod
    command: python -m src.services.workflow.email_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ar_control_hub}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - postgres_password
      - smtp_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${EMAIL_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - ar_network_internal

  # ============================================================================
  # Nginx Reverse Proxy (Production)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ar_nginx_prod
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - ar_network_public

# ==============================================================================
# Secrets
# ==============================================================================
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: ar_postgres_data_prod
    driver: local
  redis_data:
    name: ar_redis_data_prod
    driver: local
  import_data:
    name: ar_import_data_prod
    driver: local
  nginx_logs:
    name: ar_nginx_logs_prod
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  ar_network_internal:
    name: ar_network_internal
    driver: bridge
    internal: true
  ar_network_public:
    name: ar_network_public
    driver: bridge
